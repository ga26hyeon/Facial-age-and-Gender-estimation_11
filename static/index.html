<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로컬 얼굴 추정기</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell"><section class="hero"><p class="eyebrow">LOCAL / CPU INFERENCE</p><h1>얼굴 나이·성별 추정</h1><p class="sub">이미지를 선택하면 이 컴퓨터의 로컬 서버가 얼굴을 찾고 사전 학습 모델로 추정합니다.</p></section><section class="card"><label class="drop" id="drop"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><span class="icon">＋</span><strong>이미지를 선택하세요</strong><small>JPG, PNG, WEBP · 최대 10MB</small></label><div id="previewWrap" class="preview hidden"><img id="preview" alt="선택한 이미지 미리보기"><canvas id="overlay"></canvas></div><button id="analyze" disabled>분석 시작</button><p id="status" class="status" role="status"></p></section><section id="result" class="card hidden"><div class="resultHead"><div><p class="eyebrow">RESULT</p><h2>추정 결과</h2></div><span class="pill">추정치</span></div><div id="cards" class="results"></div><p class="notice">이 결과는 CPU에서 실행한 사전 학습 모델의 추정치이며 실제 나이·성별을 보장하지 않습니다. 중요한 판단에 사용하지 마세요.</p></section></main><script src="/static/app.js"></script></body></html>
